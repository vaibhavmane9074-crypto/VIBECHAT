services:
  vibechat:
    build: ./Dockerfile
    container_name: vibechat
    ports: ["4811:4811"]
    environment:
      NODE_ENV: production
      VC_SESSION_SECRET: ${VC_SESSION_SECRET:-change-me-please-long-random}
      VC_ADMIN_EMAIL: ${VC_ADMIN_EMAIL:-admin@example.com}
      VC_ADMIN_PASSWORD: ${VC_ADMIN_PASSWORD:-ChangeMe1!}
    volumes:
      - ./data:/data
    restart: unless-stopped
